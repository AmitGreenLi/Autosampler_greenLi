[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "diy-cnc-autosampler"
version = "0.1.0"
description = "Mock-first control software for a GRBL Mega 5X DIY autosampler"
requires-python = ">=3.11"
dependencies = [
    "platformdirs>=4.0",
    "PySide6>=6.7",
    "pyserial>=3.5",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
autosampler = "autosampler.main:main"

[tool.setuptools.packages.find]
include = ["autosampler*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
